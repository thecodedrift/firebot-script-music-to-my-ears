name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block, so `contents` is
    # restated. `pull-requests: write` lets the preview-link step edit the PR
    # body. This is safe on `pull_request` (never `pull_request_target`): for a
    # PR from a fork, GitHub issues a read-only token no matter what is
    # requested here, so a fork cannot use this to write to the repo.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Uploaded after the tests so an artifact only ever exists for a green
      # build. Firebot loads a single .js, but upload-artifact always zips, so
      # testers download the zip and unpack the one file inside it.
      - name: Upload preview build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: musicToMyEars-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          path: dist/musicToMyEars.js
          retention-days: 14
          if-no-files-found: error

      # Rewrites the <!-- artifact --> region of the PR body so it always points
      # at the newest green build. Skipped for forks, whose read-only token
      # cannot update a PR (see the `permissions` note on this job).
      - name: Link the preview build in the PR body
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const START = '<!-- artifact -->';
            const END = '<!-- /artifact -->';
            const pr = context.payload.pull_request;

            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const url = process.env.ARTIFACT_URL || runUrl;
            const sha = pr.head.sha.slice(0, 7);

            const block = [
              START,
              '### Preview build',
              '',
              `**[Download the built plugin](${url})** — from \`${sha}\`, kept for 14 days.`,
              '',
              'It arrives zipped (a GitHub Actions constraint, even for one file). Unzip it, then',
              'load `musicToMyEars.js` in Firebot via **Settings → Scripts**. Requires a GitHub login.',
              END,
            ].join('\n');

            const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const region = new RegExp(`${escape(START)}[\\s\\S]*?${escape(END)}`);
            const body = pr.body ?? '';
            // Function replacer, not a string: `$&` and `$1` in the replacement
            // would otherwise be interpreted as capture references.
            const next = region.test(body)
              ? body.replace(region, () => block)
              : `${body.trimEnd()}\n\n${block}\n`;

            if (next === body) {
              core.info('PR body already up to date; nothing to write.');
              return;
            }
            await github.rest.pulls.update({
              ...context.repo,
              pull_number: pr.number,
              body: next,
            });
            core.info(`Linked preview build: ${url}`);
